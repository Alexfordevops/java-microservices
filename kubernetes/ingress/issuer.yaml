apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: micro-local-cert
  namespace: ingress-nginx
spec:
  secretName: micro-local-tls
  dnsNames:
    - micro.local
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer