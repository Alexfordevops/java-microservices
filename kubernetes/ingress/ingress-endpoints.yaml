apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: micro-ingress-endpoints
  namespace: java-microservices
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  rules:
    - http:
        paths:
          # API
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /user
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8080

          # Assets da Angular App
          - path: /assets/
            pathType: Prefix
            backend:
              service:
                name: angular-app-service
                port:
                  number: 80

          # Angular app
          - path: /web
            pathType: Prefix
            backend:
              service:
                name: angular-app-service
                port:
                  number: 80
          
          # RabbitMQ management
          - path: /rabbitmq
            pathType: Prefix
            backend:
              service:
                name: rabbitmq
                port:
                  number: 15672
