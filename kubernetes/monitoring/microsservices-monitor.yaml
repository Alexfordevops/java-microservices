apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-boot-app-monitor
  namespace: java-microservices
  labels:
    release: monitoring   # nome da release do Helm do kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: spring-boot-app
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
