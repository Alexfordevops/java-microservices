apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: java-microservices
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Serve arquivos existentes ou fallback para index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
        # Evitar loop ao acessar /index.html diretamente
        location = /index.html {
            allow all;
        }
        # Cache para arquivos estáticos (CSS, JS, imagens)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public";
        }
        # Fallback de erro 404 para SPA
        error_page 404 /index.html;
    }