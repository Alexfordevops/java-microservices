version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: auth-db-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/auth_db
      DATABASE_USER: auth_user
      DATABASE_PASSWORD: auth_pass
      JWT_SECRET: minhachavesupersecretaasuperseguraa1234567890abcdefghijklmn
    depends_on:
      - postgres

volumes:
  postgres_data:
